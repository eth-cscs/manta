# `cargo audit` configuration. Read by the `cargo audit` CI step in
# `.github/workflows/ci.yml`. See https://docs.rs/cargo-audit for the
# full schema.
#
# Every entry below is a knowingly accepted transitive advisory we
# cannot fix from this workspace. Re-evaluate periodically — once the
# upstream maintainer cuts a release that drops the vulnerable
# dependency, remove the corresponding line here and the audit step
# will go green on its own.

[advisories]
ignore = [
  # Both come from openidconnect 4.0.1 (manta-cli), which uses rsa,
  # p256 and p384 only to verify the ID token's signature against the
  # realm's public JWKS keys during the browser login. manta-cli is a
  # public client: it holds no private key and never signs. Both
  # advisories are timing leaks of secret values; signature
  # verification handles only public ones (key, signature, token).
  "RUSTSEC-2023-0071", # rsa: Marvin attack, leaks the private key through
                       # timing. No patched release exists (patched = []).
  "RUSTSEC-2026-0387", # crypto-bigint 0.5: secret-dependent timing.
                       # Fixed in 0.7.6; drop once an openidconnect release
                       # pulls it in (RustCrypto elliptic-curve 0.14).
]
