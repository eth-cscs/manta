# `cargo audit` configuration. Read by the `cargo audit` CI step in
# `.github/workflows/ci.yml`. See https://docs.rs/cargo-audit for the
# full schema.
#
# Every entry below is a knowingly accepted transitive advisory we
# cannot fix from this workspace. Re-evaluate periodically — once the
# upstream maintainer cuts a release that drops the vulnerable
# dependency, remove the corresponding line here and the audit step
# will go green on its own.

[advisories]
ignore = [
  # zip 3.0.0 is a build-dependency of utoipa-swagger-ui 9.0.2
  # (manta-server), whose build script unpacks the Swagger UI release
  # archive it bundles. All three advisories are about extracting an
  # attacker-controlled archive; this one is a fixed upstream asset,
  # unpacked at build time, and zip is not in either binary. Patched
  # in zip >= 9.0.0, but no utoipa-swagger-ui release requires it yet
  # (10.0.1, the latest, still pins zip ^8.6). Drop these once one does.
  "RUSTSEC-2026-0367", # SUID/SGID bits preserved on extraction
  "RUSTSEC-2026-0368", # symlink targets escape the destination
  "RUSTSEC-2026-0369", # permissions applied through symlinks
]
