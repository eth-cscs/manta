[workspace]
resolver = "3"
members = ["crates/manta-shared", "crates/manta-cli", "crates/manta-server"]

# Shared package metadata. Inherited per-crate via `version.workspace = true`.
[workspace.package]
version      = "2.0.0-beta.68"
edition      = "2024"
authors      = [
  "Manuel Sopena Ballesteros <msopena@cscs.ch>",
  "Miguel Gila <miguel.gila@cscs.ch>",
]
# `license-file` is set per-crate (NOT inherited) so cargo doesn't
# stamp the published manifest with `../../LICENSE` — a back-walking
# path that cargo-publish warns about and cargo-dist fails to copy
# from in CI. Each crate has its own LICENSE next to its Cargo.toml.
repository   = "https://github.com/eth-cscs/manta"

# Shared external dep versions. Crates opt in with
# `<crate> = { workspace = true }`. Keeping them here means the three
# workspace members can't drift apart on tokio/serde/reqwest/etc.
[workspace.dependencies]
# Internal workspace crate. `path` lets local builds use the in-tree
# copy (always at the workspace version); `version` is what cargo
# stamps into the published manta-cli manifest so downstream installs
# resolve from crates.io. The `=` pin is because manta-shared and
# manta-cli move together — they're not independently semver-
# compatible. Bump this in lockstep with the workspace version on
# every release.
manta-shared             = { path = "crates/manta-shared", version = "=2.0.0-beta.68" }
# Sibling repos — registry-only (no `path = "../..."`) so CI runners
# and fresh-clone contributors that don't have the adjacent sibling
# checkouts can still resolve them. cargo's `path` attribute is
# "always use the path", not "use path if present, fall back to
# registry", so the path form broke `cargo metadata` in any
# environment without the sibling layout.
#
# For inner-loop work that spans these repos, use the uncommitted
# `.cargo/config.toml` `paths = ["../manta-backend-dispatcher", …]`
# override (the file is in `.gitignore`). It activates whenever the
# sibling checkouts exist and is silently skipped otherwise, so the
# same manifest works for both CI and sibling-aware contributors.
# Do NOT add a committed `[patch.crates-io]` block here — that breaks
# `cargo metadata` everywhere the siblings aren't checked out.
#
# A normal build needs NO sibling checkouts: the pins below resolve
# from crates.io and build the whole workspace, manta-server included
# (verified 2026-08-21, `cargo check --workspace`, no checkouts and no
# `.cargo/config.toml` present). An earlier note here claimed manta
# could only be built with the siblings checked out, because
# `apply/sat_file/image_pipeline.rs` needed unreleased SatTrait
# additions; that shipped, and the CLI no longer links the backend
# traits at all — it drives the image pipeline over HTTP against
# manta-server.
#
# Only check a sibling out when actively editing unreleased sibling
# code, and then check out the tag matching the pin below (`v1.0.0-
# beta.N`), NOT the sibling's `main` — the mains have diverged and
# mixing them produces ConsoleTrait signature mismatches that look
# like missing methods. `ochami-rs` is under the `OpenCHAMI` GitHub
# org; the other two are `eth-cscs`. See CLAUDE.md § Sibling-repo
# dependencies.
manta-backend-dispatcher = "1.0.0-beta.15"
csm-rs                   = { version = "1.0.0-beta.23", features = ["commands-admin"] }
ochami-rs                = "1.0.0-beta.17"

anyhow             = { version = "1.0.44", default-features = false }
base64             = { version = "0.22", default-features = false }
chrono             = { version = "0.4.41", default-features = false }
config             = { version = "0.15.19", features = ["toml"], default-features = false }
dialoguer          = { version = "0.12.0", features = ["password"], default-features = false }
directories        = "6.0.0"
futures            = { version = "0.3.31", default-features = false }
minijinja          = { version = "2.4.0", features = ["custom_syntax"] }
rdkafka            = "0.39"
regex              = "1.6.0"
reqwest            = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls", "socks", "stream"] }
serde              = { version = "1.0.219", features = ["derive"] }
serde_json         = "1.0.140"
serde_yaml         = "0.9.34"
strum              = { version = "0.27.1", default-features = false }
strum_macros       = "0.27.1"
thiserror          = "2.0.12"
tokio              = { version = "1.45", features = ["rt", "rt-multi-thread", "sync", "macros", "io-util", "io-std", "net", "signal", "time"] }
tokio-tungstenite  = "0.29"
tokio-util         = "0.7.4"
toml               = "0.8.16"
toml_edit          = "0.22.27"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa             = { version = "5.5", features = ["axum_extras", "uuid"] }
uuid               = { version = "1.16.0", features = ["fast-rng", "v4"] }

[profile.release]
opt-level = "s"
debug     = 1

[profile.dist]
inherits = "release"
lto      = "thin"
